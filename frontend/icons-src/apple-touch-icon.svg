<!-- Icona della schermata Home su iOS, sistema chiaro (#30). Sorgente di public/icons/apple-touch-icon.png:
     dopo una modifica, «npm run icons». Quadrato pieno, senza angoli né trasparenze: la maschera la mette iOS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEF2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" stroke-width="28.5">
    <ellipse cx="256" cy="256" rx="186" ry="80" transform="rotate(-25 256 256)" stroke="#5FE0C7"/>
    <circle cx="256" cy="256" r="61" stroke="#F2C46B"/>
  </g>
</svg>
