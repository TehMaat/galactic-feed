name: Immagine Docker

# Costruisce l'immagine per amd64, arm64 e armv7.
# - Sulle pull request: solo la build e una prova del container (niente pubblicazione).
# - Su main: pubblica ghcr.io/<proprietario>/galactic-feed:latest.
# - Release automatiche: se su main il numero in VERSION (per esempio 0.4.0) non ha ancora
#   il suo tag, pubblica anche :0.4.0 e :0.4, poi crea il tag v0.4.0 e la release su GitHub
#   con le note prese da CHANGELOG.md. Per fare una versione basta quindi unire una PR che
#   cambia VERSION (scripts/release.py bump): nessun tag a mano.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - VERSION
      - docker-compose.yml
      - backend/requirements.txt
      - backend/app/**
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quale versione è questa e se va pubblicata come release (su main, se il tag non c'è ancora).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, pacchetti e CHANGELOG.md coincidono
        run: python3 scripts/release.py check
      - name: Release da fare?
        id: v
        run: |
          version="$(cat VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${version%%-*}" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
              release=true
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Versione ${version}, release da fare: ${release}"

  image:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Nome dell'immagine (GHCR vuole le minuscole)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build per questa macchina (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: galactic-feed:prova
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prova del container
        run: |
          docker run -d --name prova -p 8080:8080 -e PUBLIC_URL=http://localhost:8080 galactic-feed:prova
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' prova)" = healthy ] && break
            sleep 2
          done
          docker logs prova
          test "$(docker inspect -f '{{.State.Health.Status}}' prova)" = healthy
          test "$(docker exec prova id -u)" != 0
          docker logs prova 2>&1 | grep -q "Codice di primo avvio: [0-9]\{6\}"
          curl -fsS http://localhost:8080/api/health | grep -q "\"version\":\"$(cat VERSION)\""
          curl -fsS http://localhost:8080/ | grep -q "<title>"
          curl -fsS http://localhost:8080/manifest.webmanifest | grep -q '"Galactic Feed"'
          curl -fsSI http://localhost:8080/sw.js | grep -qi "cache-control: no-cache"
          docker rm -f prova

      - name: Etichette
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.release == 'true' && needs.version.outputs.prerelease == 'false' }}
            type=sha,format=short

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build per amd64, arm64 e armv7 (e pubblicazione, fuori dalle PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag e release su GitHub, solo dopo la pubblicazione delle immagini.
  release:
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Note dalla sezione della versione in CHANGELOG.md
        run: python3 scripts/release.py notes "${{ needs.version.outputs.version }}" > notes.md
      - name: Crea il tag e la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="\`${image}:${VERSION}\`"
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          else
            tags="${tags} e \`${image}:${MINOR}\`"
          fi
          printf '\n### Immagine Docker\n\n%s per amd64, arm64 e armv7.\n' "$tags" >> notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "Galactic Feed ${VERSION}" --notes-file notes.md $flags
