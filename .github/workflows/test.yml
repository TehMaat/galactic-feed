name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Lo lanciano anche i workflow Screenshot e Diagrammi dopo aver aggiunto un commit a un branch:
  # i commit fatti da un workflow non fanno partire gli altri workflow da soli.
  workflow_dispatch:

jobs:
  # Ogni PR che cambia l'app è una versione nuova: deve cambiare anche VERSION
  # (scripts/release.py bump minor|patch). PR di soli test, documenti o workflow no.
  versione:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Se cambia l'app, cambia anche VERSION
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          app="$(git diff --name-only "$BASE" HEAD -- backend/app frontend/src frontend/public frontend/index.html Dockerfile backend/requirements.txt frontend/package.json)"
          if [ -z "$app" ]; then
            echo "La PR non cambia l'app: nessuna versione nuova."
            exit 0
          fi
          before="$(git show "$BASE:VERSION")"
          after="$(cat VERSION)"
          if [ "$before" = "$after" ]; then
            echo "::error::La PR cambia l'app ma VERSION resta $after. Usa «python3 scripts/release.py bump minor» (novità) o «bump patch» (solo correzioni)."
            echo "$app"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${after}" > /dev/null; then
            echo "::error::La versione $after è già stata pubblicata: aggiorna il ramo con main e rifai il bump."
            exit 1
          fi
          echo "Versione $before → $after."

  # La documentazione non resta indietro (#55): variabili, link, diagrammi, dati inventati, badge,
  # serie consigliata. Vedi docs/sviluppo.md, «Documentazione sempre aggiornata».
  documenti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentazione in ordine
        run: python scripts/docs.py check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: VERSION, pacchetti e CHANGELOG.md coincidono
        run: python ../scripts/release.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Test unitari (vitest)
        run: npm test
      - name: Compila la PWA
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test nel browser (Playwright, con il server vero)
        run: npx playwright test
        env:
          GF_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
