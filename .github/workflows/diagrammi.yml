name: Diagrammi

# Sulle PR che cambiano un diagramma (docs/diagrammi/*.mmd) rigenera le immagini SVG chiare e
# scure in docs/img/diagrammi/ e le aggiunge al branch della PR (#55). Così il job «documenti»
# del workflow Test, che controlla che immagini e sorgenti coincidano, torna verde da solo.
# A mano rigenera i diagrammi del branch scelto.

on:
  pull_request:
    paths:
      - docs/diagrammi/**
      - scripts/docs.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: diagrammi-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagrammi:
    # Solo per i branch di questo repository: su quelli dei fork non si può scrivere.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Disegna i diagrammi
        env:
          # Il Chrome già installato sulle macchine di GitHub: niente download.
          PUPPETEER_SKIP_DOWNLOAD: "true"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: python scripts/docs.py diagrammi
      - name: Commit sul branch, se sono cambiati
        id: commit
        run: |
          git add docs/img/diagrammi
          if git diff --cached --quiet; then
            echo "Diagrammi già aggiornati."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Diagrammi rigenerati dai sorgenti in docs/diagrammi"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Test sul branch
        # I commit fatti da un workflow non fanno partire gli altri workflow: si lanciano a mano.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.head_ref || github.ref_name }}"
      - name: Controllo
        run: python scripts/docs.py check
