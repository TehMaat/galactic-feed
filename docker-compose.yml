# Esempio di avvio con Docker Compose:
#   docker compose up -d
#   docker compose logs galactic-feed     ← qui trovi il codice di primo avvio
#
# Cambia PUBLIC_URL con l'indirizzo da cui aprirai l'app (quello del reverse proxy).

services:
  galactic-feed:
    # :0.3 riceve da solo le correzioni della versione 0.3 (0.3.1, 0.3.2…). Per passare a una
    # versione nuova cambia il numero (le novità sono in CHANGELOG.md); :latest segue sempre main.
    image: ghcr.io/tehmaat/galactic-feed:0.6
    container_name: galactic-feed
    restart: unless-stopped
    ports:
      # Con il reverse proxy sulla stessa macchina puoi usare "127.0.0.1:8080:8080",
      # così l'app si raggiunge solo passando dal proxy.
      - "8080:8080"
    environment:
      PUBLIC_URL: "https://notizie.example.org"
      TZ: "Europe/Rome"
      # Facoltative, solo all'avvio (vedi il README):
      # FORWARDED_ALLOW_IPS: "*"
      # LOG_LEVEL: "info"
      # Durata delle sessioni, conservazione degli articoli, rete locale e il resto si
      # scelgono nell'app, in Amministrazione. Qui eventualmente solo un valore iniziale:
      # RETENTION_DAYS: "90"
      # BLOCK_PRIVATE_NETWORKS: "false"
    volumes:
      - galactic-data:/data

volumes:
  galactic-data:
